name: ETF daily allocation PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: etf-daily-allocation
  cancel-in-progress: false

jobs:
  calculate-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calculate allocation from uploaded data
        run: python run_allocation.py

      - name: Add allocation to workflow summary
        if: always()
        run: test ! -f /tmp/github-step-summary.md || cat /tmp/github-step-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update allocation pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RUN_DATE=$(TZ=Asia/Kolkata date +%F)
          BRANCH="actions/etf-allocation-${RUN_DATE}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add output

          if git diff --cached --quiet; then
            echo "No allocation changes to commit."
            exit 0
          fi

          git commit -m "Add ETF allocation for ${RUN_DATE}"
          git push --force-with-lease origin "$BRANCH"

          EXISTING_PR=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "ETF allocation for ${RUN_DATE}" \
              --body-file output/allocation_report.md
          else
            gh pr edit "$EXISTING_PR" \
              --repo "$REPOSITORY" \
              --title "ETF allocation for ${RUN_DATE}" \
              --body-file output/allocation_report.md
          fi
